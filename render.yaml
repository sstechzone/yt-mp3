services:
  - type: web
    name: ytmp3-api
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: API_KEY
        generateValue: true

      - key: SUPPORTED_HOSTS
        value: youtube.com,youtu.be,soundcloud.com