services:
  - type: web
    name: ytmp3-api
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: API_KEY
        generateValue: true
      - key: MAX_FILE_SIZE_MB
        value: "100"
      - key: SOCKET_TIMEOUT
        value: "20"
      - key: MAX_CONCURRENT_DOWNLOADS
        value: "2"
